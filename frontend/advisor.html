<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wellbeing Advisor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #1a1a24; color: #fff; padding: 20px; }
        a { color: #00ff66; }
        .dashboard { display: flex; justify-content: center; gap: 30px; margin-top: 20px; flex-wrap: wrap; align-items: flex-start; }
        .card { background: #252538; padding: 20px; border-radius: 12px; width: 100%; max-width: 440px; box-sizing: border-box; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; border-bottom: 2px solid #444; padding-bottom: 10px; color: #00ff66; }
        .stat-line { margin: 8px 0; font-size: 1.05rem; }
        button { background: #1fa855; color: white; border: none; padding: 12px 22px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 15px; }
        button:hover:not(:disabled) { background: #178a45; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        .hint { color: #aaa; font-size: 0.9rem; margin-top: 10px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: #555; margin-bottom: 10px; }
        .badge.llm { background: #1fa855; }
        .suggestion { background: #1f1f2e; border-left: 4px solid #00ff66; padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
        .suggestion strong { display: block; margin-bottom: 4px; }
        .notice { background: #4a3b12; border: 1px solid #c9a227; padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
        .disclaimer { font-size: 0.85rem; color: #aaa; margin-top: 16px; }
        .meta { font-size: 0.85rem; color: #aaa; }
        .error { color: #ff6b78; }
        textarea { box-sizing: border-box; width: 100%; min-height: 100px; margin-top: 10px; padding: 10px; border: 1px solid #555; border-radius: 6px; background: #1f1f2e; color: #fff; font: inherit; resize: vertical; }
    </style>
</head>
<body>

    <h1>Wellbeing Advisor</h1>
    <p id="advisor-back-link"><a href="/">&larr; Back to the Face AI</a></p>

    <div class="dashboard">
        <div class="card">
            <h3>Data from the Face AI</h3>
            <div id="data-box">Loading...</div>
            <label for="journal-input">Journal entry</label>
            <textarea id="journal-input" placeholder="Write how you are feeling."></textarea>
            <button id="advice-btn" onclick="getAdvice()" disabled>Get advice</button>
            <div class="hint" id="hint"></div>
        </div>

        <div class="card">
            <h3>Advice</h3>
            <div id="advice-box">Press "Get advice" to generate suggestions from the data on the left.</div>
        </div>
    </div>

    <script>
        const MIN_SAMPLES = 20;
        const dataBox = document.getElementById('data-box');
        const adviceBox = document.getElementById('advice-box');
        const adviceBtn = document.getElementById('advice-btn');
        const hint = document.getElementById('hint');
        const journalInput = document.getElementById('journal-input');
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        if (window.self !== window.top) {
            document.getElementById('advisor-back-link').hidden = true;
        }

        let latest = null;
        let latestReadings = [];
        let generating = false;
        let elapsed = 0;

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function fmtDuration(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function dominantOf(d) {
            if (d.dominant_emotion) return d.dominant_emotion;
            return Object.entries(d.summary).sort((a, b) => b[1] - a[1])[0][0];
        }

        function renderData(d) {
            dataBox.replaceChildren();
            const emotionCount = d ? d.total_records : 0;
            if (emotionCount === 0 && latestReadings.length === 0) {
                dataBox.textContent = "No data yet. Start a session on the Face AI page first.";
                return;
            }
            const line = (label, value) => {
                const div = el('div', 'stat-line');
                div.appendChild(el('strong', null, label + ' '));
                div.appendChild(document.createTextNode(value));
                dataBox.appendChild(div);
            };
            if (d && emotionCount > 0) {
                const dom = dominantOf(d);
                line('Session:', d.active ? 'running' : 'stopped');
                line('Length:', fmtDuration(d.duration_seconds));
                line('Emotion samples:', String(emotionCount));
                line('Dominant emotion:', `${dom.toUpperCase()} (${d.summary[dom]}%)`);
                for (const [emotion, pct] of Object.entries(d.summary).sort((a, b) => b[1] - a[1])) {
                    line(emotion.toUpperCase() + ':', pct + '%');
                }
            }
            const heartRates = latestReadings.filter(r => r.type === 'heart_rate');
            const conductance = latestReadings.filter(r => r.type === 'skin_conductance');
            line('Heart-rate readings:', String(heartRates.length));
            if (heartRates.length) line('Latest heart rate:', `${heartRates[heartRates.length - 1].value} bpm`);
            line('Skin-conductance readings:', String(conductance.length));
            if (conductance.length) line('Latest skin conductance:', `${conductance[conductance.length - 1].value} uS`);
        }

        function updateButton() {
            const n = latest ? latest.total_records : 0;
            const heartRateCount = latestReadings.filter(r => r.type === 'heart_rate').length;
            const conductanceCount = latestReadings.filter(r => r.type === 'skin_conductance').length;
            const enough = n >= MIN_SAMPLES || heartRateCount >= 5 || conductanceCount >= 5;
            const hasJournal = journalInput.value.trim().length > 0;
            adviceBtn.disabled = generating || (!enough && !hasJournal);
            if (generating) {
                hint.textContent = `Generating... ${elapsed}s (this can take up to a minute)`;
            } else if (!enough && !hasJournal) {
                hint.textContent = `Need ${MIN_SAMPLES} emotion samples or 5 readings from either sensor, or add a journal entry.`;
            } else {
                hint.textContent = "";
            }
        }

        journalInput.addEventListener('input', updateButton);

        async function loadData() {
            try {
                const [emotionResponse, sensorResponse] = await Promise.all([
                    fetch('/emotion-summary'),
                    fetch('/api/sensors')
                ]);
                const [d, sensors] = await Promise.all([emotionResponse.json(), sensorResponse.json()]);
                latest = d.status === 'success' ? d : null;
                latestReadings = sensors.status === 'success' ? sensors.readings || [] : [];
                renderData(latest);
            } catch (e) {
                dataBox.textContent = "Cannot reach the server.";
            }
            updateButton();
        }

        function renderAdvice(data, snap) {
            adviceBox.replaceChildren();

            const badge = el('span', data.source === 'llm' ? 'badge llm' : 'badge',
                data.crisis_response ? 'Immediate safety response'
                    : data.source === 'llm' ? `Written by the local AI model (${data.model})`
                        : 'Built-in guidance (the AI model was not available)');
            adviceBox.appendChild(badge);
            if (data.crisis_response) {
                adviceBox.appendChild(el('div', 'meta', 'Triggered by the journal entry.'));
            } else {
                adviceBox.appendChild(el('div', 'meta',
                    `Based on ${snap.total_records} samples over ${fmtDuration(snap.duration_seconds)}.`));
            }

            if (data.summary) adviceBox.appendChild(el('p', null, data.summary));

            for (const s of data.suggestions || []) {
                const box = el('div', 'suggestion');
                box.appendChild(el('strong', null, s.title));
                box.appendChild(document.createTextNode(s.advice));
                adviceBox.appendChild(box);
            }

            if (data.see_doctor) {
                adviceBox.appendChild(el('div', 'notice', "Please consider talking to a professional about this."));
            }
            adviceBox.appendChild(el('div', 'disclaimer', data.disclaimer || ''));
            if (data.duration_seconds !== undefined) {
                adviceBox.appendChild(el('div', 'meta', `Generated in ${data.duration_seconds}s.`));
            }
        }

        function renderError(msg) {
            adviceBox.replaceChildren(el('div', 'error', msg));
        }

        async function getAdvice() {
            if (generating) return;
            const snap = latest || { summary: {}, total_records: 0, duration_seconds: 0 };
            const journal = journalInput.value.trim();
            const hasEnoughSensorData = latestReadings.filter(r => r.type === 'heart_rate').length >= 5
                || latestReadings.filter(r => r.type === 'skin_conductance').length >= 5;
            if (snap.total_records < MIN_SAMPLES && !hasEnoughSensorData && !journal) return;
            generating = true;
            elapsed = 0;
            adviceBox.replaceChildren(el('div', null, "Generating advice..."));
            const timer = setInterval(() => { elapsed++; updateButton(); }, 1000);
            updateButton();

            try {
                const payload = {
                    emotion_summary: snap.summary || {},
                    readings: latestReadings,
                    journal: journal ? [journal] : []
                };
                const res = await fetch('/api/advice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data;
                try { data = await res.json(); }
                catch (e) {
                    throw new Error(res.status === 504 || res.status === 524
                        ? "The server took too long to answer. Try again in a moment."
                        : `The server returned an unexpected answer (HTTP ${res.status}).`);
                }

                if (res.ok && data.status === 'success') renderAdvice(data, snap);
                else renderError(data.message || "The server could not generate advice.");
            } catch (e) {
                renderError(e instanceof TypeError
                    ? "Cannot reach the server. Try again in a moment."
                    : e.message);
            } finally {
                clearInterval(timer);
                generating = false;
                updateButton();
            }
        }

        (async function loop() {
            while (true) {
                await loadData();
                await sleep(5000);
            }
        })();
    </script>
</body>
</html>
